<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
  <title id="t">design-bar demo terminal</title>
  <desc id="d">A terminal session: dna_lint refuses a vague rulebook with nine named gaps, slop_scan catches thirteen tells on the slop page, and the clean page passes. Long commands wrap with a backslash continuation; long report lines are shortened, trims marked with dots.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="460" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">taste, enforced</text>
  <text x="24" y="80"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 tools/dna_lint.py demo/broken-rulebook.md</tspan></text>
  <text x="24" y="112" class="dim">INCOMPLETE - 9 gap(s):</text>
  <text x="24" y="144" class="dim">  - no front-matter block (--- at line 1)</text>
  <text x="24" y="176" class="dim">  - section 'colors' has no provenance marker - tag values…</text>
  <text x="24" y="208"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 tools/slop_scan.py demo/slop-page.html --tells \</tspan></text>
  <text x="24" y="240" class="cmd">    config/tells.json</text>
  <text x="24" y="272" class="dim">SLOP - 13 tell(s):</text>
  <text x="24" y="304" class="dim">  - framework-default gradient nobody chose: #667eea + #764…</text>
  <text x="24" y="336" class="dim">  - 4 stock call-to-action(s) (limit 0): &quot;Get Started&quot;, &quot;Le…</text>
  <text x="24" y="368"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 tools/slop_scan.py demo/clean-page.html --tells \</tspan></text>
  <text x="24" y="400" class="cmd">    config/tells.json</text>
  <text x="24" y="432" class="good">CLEAN - none of the configured tells present.</text>
</svg>